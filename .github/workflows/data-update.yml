name: Fetch all data and compute sahm rule

on:
  schedule:
    # Times are UTC. BLS releases the jobs report at 8:30 AM ET, usually on the first Friday.
    # Fridays: 14:15, 17:15, 21:15 UTC = 10:15 AM, 1:15 PM, 5:15 PM EDT (9:15 AM, 12:15 PM, 4:15 PM EST)
    - cron: "15 14,17,21 * * 5"
    # Mondays and Wednesdays at 14:15 UTC, to catch county (LAUS) releases and FRED revisions
    - cron: "15 14 * * 1,3"
  workflow_dispatch: # Allows manual trigger
    inputs:
      MAX_COUNTIES_TO_FETCH:
        type: string
        description: Set to number to limit processing, leave empty for all
        required: false
        default: ''

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch-map-data:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run data update script
        run: node ./data-source/fetch-and-compute.js
        env:
          MAX_COUNTIES_TO_FETCH: ${{ github.event.inputs.MAX_COUNTIES_TO_FETCH }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Build compact map files for the site
        run: node ./data-source/build-compact-map.js

      - name: Upload modified files (fetch-map-data)
        uses: actions/upload-artifact@v4
        with:
          name: fetch-map-data-files
          path: ./data-source/map-data

  fetch-tool-data:
    runs-on: ubuntu-latest
    environment: github-pages
    container:
      image: rocker/tidyverse:latest # Use the official tidyverse image
      options: --user root # Optional: ensure the user has root access for installing packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install additional R packages
        run: |
          R -e "install.packages(c('fredr', 'lubridate'))"
        env:
          R_LIBS_USER: ${{ runner.temp }}/Library

      - name: Run FRED data fetch script
        run: Rscript data-source/fetch_files.R
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Upload modified files (fetch-tool-data)
        uses: actions/upload-artifact@v4
        with:
          name: fetch-tool-data-files
          path: ./data-source/tool-data

  spatial-stats:
    # County statistics behind the charts on the spatial page (data-source/Spatial_County_Stats.Rmd).
    # Runs on the freshly fetched county data; if it fails, the rest of the update still goes through.
    runs-on: ubuntu-24.04
    needs: fetch-map-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download files from fetch-map-data
        uses: actions/download-artifact@v4
        with:
          name: fetch-map-data-files
          path: ./data-source/map-data

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::zoo
            any::forecast
            any::jsonlite
            any::rmarkdown
            any::knitr

      - name: Compute county statistics for the spatial page
        working-directory: data-source
        run: Rscript -e 'rmarkdown::render("Spatial_County_Stats.Rmd", output_dir = tempdir())'

      - name: Upload spatial statistics
        uses: actions/upload-artifact@v4
        with:
          name: spatial-stats-files
          path: data/spatial_*

  commit:
    runs-on: ubuntu-latest
    environment: github-pages
    needs: [fetch-map-data, fetch-tool-data, spatial-stats] # Ensure this job waits for the previous jobs
    # Commit the BLS and county data even if the spatial statistics fail
    if: ${{ !cancelled() && needs.fetch-map-data.result == 'success' && needs.fetch-tool-data.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download files from fetch-map-data
        uses: actions/download-artifact@v4
        with:
          name: fetch-map-data-files
          path: ./data-source/map-data

      - name: Download files from fetch-tool-data
        uses: actions/download-artifact@v4
        with:
          name: fetch-tool-data-files
          path: ./data-source/tool-data

      - name: Download spatial statistics
        if: ${{ needs.spatial-stats.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: spatial-stats-files
          path: ./data

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push all changes
        run: |
          # Stage all changes from both fetch-map-data and fetch-tool-data jobs
          git add .  # Stage all changes
          # Record when the public BLS/FRED data were refreshed, for "Data last fetched" on the site
          if ! git diff --cached --quiet; then
            python3 -c "import json,datetime;p='data/last_updated.json';d=json.load(open(p));d['bls']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ');json.dump(d,open(p,'w'),indent=2)"
            git add data/last_updated.json
          fi

          # Check if there are any changes to commit
          git diff --cached --quiet || (
            git commit -m "chore: update all data files for map and interactive tool" && 
            git pull --rebase && 
            git push
          )

      - name: Trigger Webpage Deployment Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: webpage-deployment.yaml
          ref: ${{ github.ref }}
