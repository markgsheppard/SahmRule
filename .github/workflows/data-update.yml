name: Fetch all data and compute sahm rule

on:
  schedule:
    # Times are UTC. BLS releases the jobs report at 8:30 AM ET, usually on the first Friday.
    # Fridays: 14:15, 17:15, 21:15 UTC = 10:15 AM, 1:15 PM, 5:15 PM EDT (9:15 AM, 12:15 PM, 4:15 PM EST)
    - cron: "15 14,17,21 * * 5"
    # Mondays and Wednesdays at 14:15 UTC, to catch county (LAUS) releases and FRED revisions
    - cron: "15 14 * * 1,3"
  workflow_dispatch: # Allows manual trigger
    inputs:
      MAX_COUNTIES_TO_FETCH:
        type: string
        description: Set to number to limit processing, leave empty for all
        required: false
        default: ''

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch-map-data:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run data update script
        run: node ./data-source/fetch-and-compute.js
        env:
          MAX_COUNTIES_TO_FETCH: ${{ github.event.inputs.MAX_COUNTIES_TO_FETCH }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Upload modified files (fetch-map-data)
        uses: actions/upload-artifact@v4
        with:
          name: fetch-map-data-files
          path: ./data-source/map-data

  fetch-tool-data:
    runs-on: ubuntu-latest
    environment: github-pages
    container:
      image: rocker/tidyverse:latest # Use the official tidyverse image
      options: --user root # Optional: ensure the user has root access for installing packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install additional R packages
        run: |
          R -e "install.packages(c('fredr', 'lubridate'))"
        env:
          R_LIBS_USER: ${{ runner.temp }}/Library

      - name: Run FRED data fetch script
        run: Rscript data-source/fetch_files.R
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Upload modified files (fetch-tool-data)
        uses: actions/upload-artifact@v4
        with:
          name: fetch-tool-data-files
          path: ./data-source/tool-data

  commit:
    runs-on: ubuntu-latest
    environment: github-pages
    needs: [fetch-map-data, fetch-tool-data] # Ensure this job waits for both previous jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download files from fetch-map-data
        uses: actions/download-artifact@v4
        with:
          name: fetch-map-data-files
          path: ./data-source/map-data

      - name: Download files from fetch-tool-data
        uses: actions/download-artifact@v4
        with:
          name: fetch-tool-data-files
          path: ./data-source/tool-data

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push all changes
        run: |
          # Stage all changes from both fetch-map-data and fetch-tool-data jobs
          git add .  # Stage all changes

          # Check if there are any changes to commit
          git diff --cached --quiet || (
            git commit -m "chore: update all data files for map and interactive tool" && 
            git pull --rebase && 
            git push
          )

      - name: Trigger Webpage Deployment Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: webpage-deployment.yaml
          ref: ${{ github.ref }}
