name: CPS monthly update (IPUMS microdata)

on:
  schedule:
    # Times are UTC. IPUMS posts each monthly CPS sample a few weeks after the BLS jobs report,
    # so check twice a week: Tuesdays and Thursdays at 15:20 UTC (11:20 AM EDT / 10:20 AM EST).
    - cron: "20 15 * * 2,4"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Rebuild the site files from auto/state without asking IPUMS for new months"
        type: boolean
        default: false

concurrency:
  group: cps-monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::zoo
            any::forecast
            any::ipumsr
            any::rmarkdown
            any::knitr

      - name: Pull any new CPS months and rebuild the site files
        working-directory: auto
        env:
          IPUMS_API_KEY: ${{ secrets.IPUMS_API_KEY }}
        run: |
          Rscript -e 'rmarkdown::render("CPS_Monthly_Update.Rmd", params = list(skip_fetch = ${{ github.event.inputs.skip_fetch == 'true' && 'TRUE' || 'FALSE' }}), output_dir = tempdir())'

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/explorer_series.csv data/explorer_cells.csv data/umeas_cells.csv data/decomp_u6.csv auto/state
          if git diff --cached --quiet; then
            echo "No new CPS months."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: add new CPS month(s) from IPUMS"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger webpage deployment
        if: steps.commit.outputs.changed == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: webpage-deployment.yaml
          ref: ${{ github.ref }}
