name: CPS monthly update (IPUMS microdata)

on:
  schedule:
    # Times are UTC. IPUMS posts each monthly CPS sample a few weeks after the BLS jobs report,
    # so check twice a week: Tuesdays and Thursdays at 15:20 UTC (11:20 AM EDT / 10:20 AM EST).
    - cron: "20 15 * * 2,4"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Rebuild the site files from auto/state without asking IPUMS for new months"
        type: boolean
        default: false
      test_month:
        description: "Test only: re-pull one month already on the site (e.g. 2026-09), compare it with the stored history, and commit nothing"
        type: string
        default: ""

concurrency:
  group: cps-monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::zoo
            any::forecast
            any::ipumsr
            any::rmarkdown
            any::knitr
            any::R.utils
            any::rlang

      - name: Pull any new CPS months and rebuild the site files
        working-directory: auto
        env:
          IPUMS_API_KEY: ${{ secrets.IPUMS_API_KEY }}
          TEST_MONTH: ${{ github.event.inputs.test_month }}
          SKIP_FETCH: ${{ github.event.inputs.skip_fetch == 'true' && 'TRUE' || 'FALSE' }}
        shell: bash
        run: |
          set +e
          Rscript -e 'rmarkdown::render("CPS_Monthly_Update.Rmd", params = list(skip_fetch = as.logical(Sys.getenv("SKIP_FETCH")), test_month = Sys.getenv("TEST_MONTH")), output_dir = tempdir())' > render.log 2>&1
          status=$?
          tail -60 render.log
          if [ $status -ne 0 ]; then
            # Put the R error where it is easy to find: the run's summary page and its annotations
            msg=$(grep -E -A4 "^(Error|Quitting)" render.log | head -c 1500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=CPS update failed in R::${msg:-see the log of this step}"
            { echo "### The CPS update stopped with an R error"; echo; echo '```'; tail -40 render.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f render.log
          exit $status

      - name: Commit and push changes
        id: commit
        if: github.event.inputs.test_month == '' || github.event.inputs.test_month == null
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/explorer_series.csv data/explorer_cells.csv data/umeas_cells.csv data/decomp_u6.csv auto/state
          if ! git diff --cached --quiet; then
            # Record when the CPS microdata were refreshed, for "Data last fetched" on the site
            python3 -c "import json,datetime;p='data/last_updated.json';d=json.load(open(p));d['cps']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ');json.dump(d,open(p,'w'),indent=2)"
            git add data/last_updated.json
          fi
          if git diff --cached --quiet; then
            echo "No new CPS months."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: add new CPS month(s) from IPUMS"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger webpage deployment
        if: steps.commit.outputs.changed == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: webpage-deployment.yaml
          ref: ${{ github.ref }}
